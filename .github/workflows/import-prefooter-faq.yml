name: Import PLP Pre Footer FAQ

on:
  workflow_dispatch:
    inputs:
      doc_url:
        description: Google Doc URL or ID
        required: true
        type: string
      mode:
        description: Import mode
        required: true
        default: Preview Only
        type: choice
        options:
          - Preview Only
          - CS Draft
          - CS Publish
      contentstack_environment:
        description: Contentstack publish environment names or UIDs, comma-separated (required only when publishing)
        required: false
        type: string

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    # Match web-builder: the actor's GitHub Environment owns their CMA session token.
    # This is separate from the Contentstack publish environment input above.
    environment: ${{ github.actor }}
    concurrency:
      group: plp-prefooter-import
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check GitHub secrets
        env:
          CS_API_KEY: ${{ secrets.CS_API_KEY }}
          CS_AUTHTOKEN: ${{ secrets.CS_AUTHTOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [[ -z "$CS_API_KEY" ]]; then
            echo "::error::Missing CS_API_KEY repository secret."
            exit 1
          fi
          if [[ -z "$CS_AUTHTOKEN" ]]; then
            echo "::error::Missing CS_AUTHTOKEN in the GitHub Environment named for this workflow actor."
            exit 1
          fi
          if [[ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]]; then
            echo "::error::Missing GOOGLE_CREDENTIALS or GOOGLE_SERVICE_ACCOUNT_JSON repository secret."
            exit 1
          fi
      - name: Import Google Doc
        env:
          CS_API_KEY: ${{ secrets.CS_API_KEY }}
          CS_AUTHTOKEN: ${{ secrets.CS_AUTHTOKEN }}
          CS_STACK_UID: ${{ vars.CS_STACK_UID }}
          CS_CMA_BASE_URL: ${{ vars.CS_CMA_BASE_URL }}
          CS_PARENT_FOLDER_UID: ${{ vars.CS_PARENT_FOLDER_UID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_CREDENTIALS }}
          DOC_URL: ${{ inputs.doc_url }}
          MODE: ${{ inputs.mode }}
          CONTENTSTACK_ENVIRONMENT: ${{ inputs.contentstack_environment }}
        run: |
          set -euo pipefail
          args=(--doc "$DOC_URL")
          case "$MODE" in
            "Preview Only") args+=(--dry-run) ;;
            "CS Draft") args+=(--apply) ;;
            "CS Publish")
              if [[ -z "${CONTENTSTACK_ENVIRONMENT//[[:space:],]/}" ]]; then
                echo "::error::CS Publish mode requires contentstack_environment."
                exit 1
              fi
              args+=(--apply --publish --environment "$CONTENTSTACK_ENVIRONMENT")
              ;;
            *)
              echo "::error::Unknown mode: $MODE"
              exit 1
              ;;
          esac
          node scripts/import.js "${args[@]}"
      - name: Upload preview
        id: upload-preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plp-faq-preview
          path: out/
          if-no-files-found: ignore
      - name: Link preview artifact in summary
        if: always() && inputs.mode == 'Preview Only' && steps.upload-preview.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.upload-preview.outputs.artifact-url }}
        run: |
          echo "- Preview artifact: [plp-faq-preview]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
